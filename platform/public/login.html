<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUA AI Explorers - Login</title>
  <link rel="stylesheet" href="/css/platform.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>EUA AI Explorers</h1>
      <p>Understand it. Question it. Build with it.</p>

      <div id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="button" class="btn btn-primary" style="width:100%" id="btn-login">Log in</button>
        <p style="text-align:center;margin-top:1rem;font-size:0.85rem">
          No account? <a href="#" id="show-register">Register</a>
        </p>
      </div>

      <div id="register-form" class="hidden">
        <div class="form-group">
          <label for="reg-name">Full name</label>
          <input type="text" id="reg-name" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password (min 6 characters)</label>
          <input type="password" id="reg-password" autocomplete="new-password" required>
        </div>
        <button type="button" class="btn btn-primary" style="width:100%" id="btn-register">Create account</button>
        <p style="text-align:center;margin-top:1rem;font-size:0.85rem">
          Have an account? <a href="#" id="show-login">Log in</a>
        </p>
      </div>

      <p class="error-msg hidden" id="error"></p>
      <p style="margin-top:1.5rem;font-size:0.8rem;color:var(--muted);text-align:center">
        <a href="/admin.html">Admin panel</a>
      </p>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>

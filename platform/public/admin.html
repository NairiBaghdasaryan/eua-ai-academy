<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUA AI - Admin Panel</title>
  <link rel="stylesheet" href="/css/platform.css">
</head>
<body>
  <div id="admin-login" class="auth-page">
    <div class="auth-card">
      <h1>Admin Panel</h1>
      <p>Paste YouTube links for each lesson</p>
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" value="admin@eua.am">
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password">
      </div>
      <button type="button" class="btn btn-secondary" style="width:100%" id="btn-admin-login">Log in</button>
      <p class="error-msg hidden" id="admin-error"></p>
    </div>
  </div>

  <div id="admin-app" class="hidden">
    <div class="topbar">
      <strong>EUA AI - Admin</strong>
      <div>
        <a href="/course.html" class="btn btn-outline" style="padding:0.4rem 0.75rem;font-size:0.8rem;margin-right:0.5rem">View as student</a>
        <button class="btn btn-outline" id="btn-admin-logout" style="padding:0.4rem 0.75rem;font-size:0.8rem">Log out</button>
      </div>
    </div>
    <div class="admin-shell">
      <h1>Lesson videos</h1>
      <p style="color:var(--muted);margin:-0.5rem 0 1rem">Paste a YouTube URL for each lesson, then click Save.</p>
      <div class="stats-row" id="stats"></div>
      <div style="overflow-x:auto">
        <table class="admin-table" id="lessons-table">
          <thead>
            <tr>
              <th>Module</th>
              <th>#</th>
              <th>Title (EN)</th>
              <th>Title (HY)</th>
              <th>YouTube URL</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lessons-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>

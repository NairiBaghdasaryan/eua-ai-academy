<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071c3b">
  <title>My Academy · EUA AI Academy</title>
  <link rel="stylesheet" href="css/platform.css">
</head>
<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a class="dashboard-brand" href="index.html"><span>EUA</span><strong data-copy="brand">AI Academy</strong></a>
      <nav class="dashboard-nav" aria-label="Dashboard navigation">
        <button class="active" type="button" data-view="courses" data-copy="myCourses">My courses</button>
        <button type="button" data-view="profile" data-copy="profile">Profile</button>
      </nav>
      <button class="dashboard-logout" type="button" id="btn-logout" data-copy="logout">Log out</button>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div><p class="dashboard-kicker" data-copy="myAcademy">My academy</p><h1 id="welcome-title">Welcome</h1></div>
        <div class="user-avatar" id="user-avatar" aria-hidden="true">DS</div>
      </header>

      <section class="dashboard-view" id="courses-view">
        <div class="view-heading"><div><h2 data-copy="learning">Your learning</h2><p data-copy="learningCopy">Enroll, continue learning, or explore what is coming next.</p></div><a href="index.html#courses" class="btn btn-outline" data-copy="browse">Browse academy</a></div>
        <div class="dashboard-course-grid" id="dashboard-courses"><p data-copy="loading">Loading your courses…</p></div>
      </section>

      <section class="dashboard-view hidden" id="profile-view">
        <div class="view-heading"><div><h2 data-copy="yourProfile">Your profile</h2><p data-copy="profileCopy">Keep your academy contact information up to date.</p></div></div>
        <form class="profile-card" id="profile-form">
          <div class="form-group"><label for="profile-first-name" data-copy="firstName">First name</label><input id="profile-first-name" required maxlength="80"></div>
          <div class="form-group"><label for="profile-last-name" data-copy="lastName">Last name</label><input id="profile-last-name" required maxlength="80"></div>
          <div class="form-group"><label for="profile-email" data-copy="email">Email</label><input id="profile-email" type="email" disabled></div>
          <div class="form-group"><label for="profile-phone" data-copy="phone">Phone <span>(optional)</span></label><input id="profile-phone" type="tel" maxlength="40"></div>
          <button class="btn btn-primary" type="submit" data-copy="save">Save profile</button>
          <p class="dashboard-message" id="profile-message" role="status"></p>
        </form>
      </section>
    </main>
  </div>
  <script src="js/course-catalog.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082e5d">
  <title>EUA AI Academy - Log in</title>
  <link rel="stylesheet" href="styles/eua.css">
</head>
<body class="auth-body">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-monogram" aria-hidden="true">EUA</span>
        <span class="brand-copy">
          <strong>EUA AI Academy</strong>
          <span data-copy="initiative">An initiative of the European University of Armenia</span>
        </span>
      </a>
      <div class="header-actions auth-header-actions">
        <div class="lang-toggle" role="group" aria-label="Language selection" data-copy-aria="languageLabel">
          <button type="button" data-language="en" aria-pressed="true" aria-label="English">EN</button>
          <button type="button" data-language="hy" aria-pressed="false" aria-label="Հայերեն">ՀՅ</button>
        </div>
        <a class="btn btn-secondary header-auth-light" href="index.html" data-copy="back">← Back to site</a>
      </div>
    </div>
  </header>

  <div class="auth-background" aria-hidden="true">
    <img src="assets/eua-campus.png" alt="" width="500" height="343">
  </div>

  <main class="auth-main">
    <div class="auth-card">
      <p class="eyebrow" data-copy="academyName">EUA AI Academy</p>
      <h1 data-copy="title">Understand it. Question it. Build with it.</h1>
      <p class="auth-lead" data-copy="lead">Log in or create an account to watch lessons and take module quizzes.</p>

      <div id="login-panel">
        <div class="form-group">
          <label for="email" data-copy="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password" data-copy="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="button" class="btn btn-primary btn-full" id="btn-login" data-copy="login">Log in</button>
        <p class="auth-switch"><span data-copy="noAccount">No account?</span> <a href="#" id="show-register" data-copy="register">Register</a></p>
      </div>

      <div id="register-panel" class="hidden">
        <div class="form-group">
          <label for="reg-first-name" data-copy="firstName">First name</label>
          <input type="text" id="reg-first-name" autocomplete="given-name" required>
        </div>
        <div class="form-group">
          <label for="reg-last-name" data-copy="lastName">Last name</label>
          <input type="text" id="reg-last-name" autocomplete="family-name" required>
        </div>
        <div class="form-group">
          <label for="reg-email" data-copy="email">Email</label>
          <input type="email" id="reg-email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="reg-password" data-copy="newPassword">Password (min 6 characters)</label>
          <input type="password" id="reg-password" autocomplete="new-password" required>
        </div>
        <button type="button" class="btn btn-primary btn-full" id="btn-register" data-copy="create">Create account</button>
        <p class="auth-switch"><span data-copy="haveAccount">Have an account?</span> <a href="#" id="show-login" data-copy="login">Log in</a></p>
      </div>

      <p class="error-msg hidden" id="auth-error"></p>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
